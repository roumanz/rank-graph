<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORIS Ranking Tracker – Vývoj pořadí</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div>
        <h1>Vývoj pořadí v ORIS rankingu</h1>
        <p class="subtitle">Porovnání vývoje umístění závodníků v čase (data se kešují v lokální databázi)</p>
      </div>
      <div class="share-actions" style="display:flex;align-items:center;gap:8px;padding-top:4px;">
        <span id="shareFeedback" style="font-size:0.85rem;color:#059669;"></span>
        <button type="button" id="btnShareLink" class="btn-secondary">Sdílet odkaz</button>
      </div>
    </header>

    <section class="controls-card">
      <div class="control-row">
        <!-- Typ rankingu -->
        <div class="control-group">
          <label for="rankingType">Typ rankingu</label>
          <select id="rankingType">
            <option value="">Načítám typy z ORISu…</option>
          </select>
        </div>

        <!-- Období -->
        <div class="control-group">
          <label>Období</label>
          <div class="period-toggle">
            <button type="button" id="btnLastYear" class="btn-toggle active">Poslední rok</button>
            <button type="button" id="btnCustomRange" class="btn-toggle">Vlastní Od – Do</button>
          </div>
        </div>

        <div class="control-group custom-dates hidden" id="customDatesBox">
          <div>
            <label for="dateFrom">Od</label>
            <input type="month" id="dateFrom">
          </div>
          <div>
            <label for="dateTo">Do</label>
            <input type="month" id="dateTo">
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- Výběr závodníků -->
      <div class="control-row">
        <div class="control-group grow">
          <label for="athleteSearch">Přidat závodníka (jméno nebo registračka, např. TZL8808)</label>
          <div class="search-wrapper">
            <input type="text" id="athleteSearch" placeholder="Začněte psát příjmení nebo registrační číslo…" autocomplete="off">
            <div id="searchResults" class="dropdown hidden"></div>
          </div>
        </div>

        <div class="control-group">
          <label for="clubCode">Nebo načíst oddíl (zkratka)</label>
          <div class="club-box">
            <input type="text" id="clubCode" placeholder="např. TZL" maxlength="4">
            <button type="button" id="btnLoadClub" class="btn-secondary">Načíst členy</button>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- Rychlý výběr TOP 10 podle pohlaví -->
      <div class="control-row" style="align-items:flex-end;gap:12px;flex-wrap:wrap;">
        <div class="control-group">
          <label>Porovnat TOP 10 žebříčku</label>
          <div class="period-toggle" id="topGenderToggle">
            <button type="button" id="btnGenderM" class="btn-toggle active" data-gender="M">Muži</button>
            <button type="button" id="btnGenderF" class="btn-toggle" data-gender="F">Ženy</button>
          </div>
        </div>

        <div class="control-group" style="flex-direction:row;gap:8px;align-items:center;">
          <button type="button" id="btnLoadTop10" class="btn-secondary">Načíst TOP 10</button>
          <button type="button" id="btnAddTop10" class="btn-link">Přidat ke stávajícím</button>
        </div>
      </div>

      <!-- Seznam členů oddílu pro rychlé zaklikání -->
      <div id="clubMembersBox" class="club-members hidden">
        <div class="club-members-header">
          <strong id="clubMembersTitle">Členové oddílu</strong>
          <div style="display:flex;align-items:center;gap:12px;">
            <button type="button" id="btnAddAllClub" class="btn-link">Přidat všechny</button>
            <button type="button" id="btnClearClub" class="btn-link">Odebrat všechny</button>
            <button type="button" id="btnCloseClub" class="btn-link">Zavřít seznam</button>
          </div>
        </div>
        <div id="clubMembersList" class="club-members-list"></div>
      </div>

      <!-- Vybraní závodníci (štítky) -->
      <div class="selected-box">
        <span class="selected-label">Vybraní závodníci v grafu:</span>
        <div id="selectedAthletes" class="chips"></div>
        <button type="button" id="btnClearAllAthletes" class="btn-link">Vymazat vše</button>        
      </div>
    </section>

    <!-- Stavová hláška (načítání z ORISu / chyba) -->
    <div id="statusBar" class="status-bar hidden"></div>

    <!-- Plátno pro graf -->
    <section class="chart-card">
      <div class="chart-wrapper">
        <canvas id="rankingChart"></canvas>
      </div>
    </section>
    
    <!-- Tabulka přehledu všech vybraných závodníků -->
    <section class="chart-card" id="summaryTableCard">
      <div class="table-header">
        <strong>Přehled umístění v jednotlivých měsících</strong>
        <span style="color:var(--muted);font-size:0.85rem;">Najetím na řádek nebo linii zvýrazníte závodníka</span>
      </div>
      <div class="table-responsive">
        <table id="rankingSummaryTable" class="summary-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
